name: Lint

# Every run step delegates to scripts/ci-local.sh so this workflow, the
# local `make ci-local` target, and the /release skill's Phase 5 validate
# the exact same inventory. Tool installation stays here (a CI concern);
# the script asserts presence and fails loud.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts (incl. stamped *.sh.template)
        run: bash scripts/ci-local.sh shellcheck

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Provide a managed Python so `pip install` does not depend on the
      # hosted runner image happening to permit installs into the system
      # interpreter (PEP 668 / externally-managed-environment). Mirrors
      # security.yml so both workflows resolve Python the same way.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install jq and check-jsonschema
        # check-jsonschema pinned (not 'latest') for reproducible CI —
        # mirrors the bandit/semgrep pins in security.yml. Not
        # dependabot-tracked: no Python manifest (see
        # .github/dependabot.yml). Bump by hand.
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          python3 -m pip install --quiet check-jsonschema==0.37.2
      - name: Validate JSON, schema, and negative fixtures
        run: bash scripts/ci-local.sh json

  doctrine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run doctrine grep checks
        run: bash scripts/ci-local.sh doctrine

  tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the dogfood-corpus-refresh oracle reads blobs at the
      # sha its permalinks cite and asks whether that sha is an ancestor of
      # HEAD. Under the default depth-1 checkout the pinned commit is not in
      # the object store at all, so every one of those assertions fails for
      # want of history rather than for want of correctness. Only this job
      # needs it; shellcheck, json-validate, and doctrine read the worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # This job's toolchain must be a superset of every ci-local
      # subcommand a suite shells out to. Three suites re-enter the script:
      # sparse-clone runs `json` and `doctrine`, git-verb-cache-scope and
      # cache-git-helper run `doctrine`. The `json` subcommand refuses to
      # degrade under CI when check-jsonschema is absent (exit 69), so a
      # tests job that installs only jq fails sparse-clone's preservation
      # check for want of a tool the json-validate job installs — a red
      # that was hidden until ci-local started running every suite.
      # Same managed-Python step and pin as json-validate; bump both.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install jq and check-jsonschema
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          python3 -m pip install --quiet check-jsonschema==0.37.2
      - name: Run all test suites (tests/*/run.sh + hooks-audit)
        run: bash scripts/ci-local.sh tests
      - name: Verify bundled examples (verify.sh, permalink density, eval dry-run)
        run: bash scripts/ci-local.sh examples
