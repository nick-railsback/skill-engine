name: Hooks Audit

# Deliberate duplicate: lint.yml's `tests` job runs this same script via
# `ci-local tests`. The standalone workflow is kept because the README's "Hooks
# Audit" badge links to it, and because it gives hook creep its own PR check
# status instead of burying it in the lint job. Unlike the comparable
# shellcheck redundancy in security.yml, the reason here is not a cron — this
# workflow has none.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hooks-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # ubuntu-latest already ships jq, so no apt install is needed (the
      # sibling security.yml avoids apt for the same reason — it keeps a flaky
      # network step out of CI).
      - name: Run hooks audit
        run: bash plugin/skill-engine/tests/hooks-audit.sh
